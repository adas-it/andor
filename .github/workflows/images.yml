name: Build & push service images to ACR

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  ACR_LOGIN_SERVER: adait.azurecr.io

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: configurations-service
            project: Src/Administrations/Configurations/Andor.Configurations.Service/Andor.Configurations.Service.csproj
            dll: Andor.Configurations.Service.dll
          - image: users-api
            project: Src/Administrations/Users/Andor.Users.WebApi/Andor.Users.WebApi.csproj
            dll: Andor.Users.WebApi.dll
          - image: assets-service
            project: Src/Assets/Andor.Assets.Service/Andor.Assets.Service.csproj
            dll: Andor.Assets.Service.dll
          - image: accounts-api
            project: Src/Budget/Andor.Accounts.Service/Andor.Accounts.Service.csproj
            dll: Andor.Accounts.Service.dll
          - image: communications-api
            project: Src/Communications/Andor.Communications.Service/Andor.Communications.Service.csproj
            dll: Andor.Communications.Service.dll
          - image: onboarding-api
            project: Src/Onboarding/Andor.Onboarding.Service/Andor.Onboarding.Service.csproj
            dll: Andor.Onboarding.Service.dll
          - image: reverse-proxy
            project: Src/Administrations/ReverseProxy/Andor.Admin.ReverseProxy.Yarp/Andor.Admin.ReverseProxy.Yarp.csproj
            dll: Andor.Admin.ReverseProxy.Yarp.dll

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            PROJECT=${{ matrix.project }}
            APP_DLL=${{ matrix.dll }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false
