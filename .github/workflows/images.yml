name: Build & push service images to ACR

on:
  # Runs after the ".NET" CI workflow finishes on main, and only if it passed.
  workflow_run:
    workflows: [".NET"]        # must match `name:` in build.yml exactly
    types: [completed]
  # Release tags are cut from an already-green main commit, so build them directly.
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: images-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

env:
  ACR_LOGIN_SERVER: adait.azurecr.io

jobs:
  build-push:
    runs-on: ubuntu-latest
    # Gate: skip unless the CI run succeeded (manual/tag runs are not gated).
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: configurations-service
            project: Src/Administrations/Configurations/Andor.Configurations.Service/Andor.Configurations.Service.csproj
            dll: Andor.Configurations.Service.dll
          - image: users-api
            project: Src/Administrations/Users/Andor.Users.WebApi/Andor.Users.WebApi.csproj
            dll: Andor.Users.WebApi.dll
          - image: assets-service
            project: Src/Assets/Andor.Assets.Service/Andor.Assets.Service.csproj
            dll: Andor.Assets.Service.dll
          - image: accounts-api
            project: Src/Budget/Andor.Accounts.Service/Andor.Accounts.Service.csproj
            dll: Andor.Accounts.Service.dll
          - image: communications-api
            project: Src/Communications/Andor.Communications.Service/Andor.Communications.Service.csproj
            dll: Andor.Communications.Service.dll
          - image: onboarding-api
            project: Src/Onboarding/Andor.Onboarding.Service/Andor.Onboarding.Service.csproj
            dll: Andor.Onboarding.Service.dll
          - image: reverse-proxy
            project: Src/Administrations/ReverseProxy/Andor.Admin.ReverseProxy.Yarp/Andor.Admin.ReverseProxy.Yarp.csproj
            dll: Andor.Admin.ReverseProxy.Yarp.dll

    steps:
      - name: Resolve source commit
        id: src
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.src.outputs.sha }}

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.image }}
          tags: |
            type=raw,value=sha-${{ steps.src.outputs.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.event.workflow_run.head_branch == 'main' }}
            type=semver,pattern={{version}}

      - name: Build & push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            PROJECT=${{ matrix.project }}
            APP_DLL=${{ matrix.dll }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false
