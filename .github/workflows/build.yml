name: .NET

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.compute.outputs.build_matrix }}
      images_matrix: ${{ steps.compute.outputs.images_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed files
        id: diff
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.event.pull_request.base.ref }}" --quiet
            CHANGED=$(git diff --name-only "origin/${{ github.event.pull_request.base.ref }}...HEAD")
            FORCE_ALL=false
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
              CHANGED=""
              FORCE_ALL=true
            else
              CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
              FORCE_ALL=false
            fi
          fi
          echo "force_all=$FORCE_ALL" >> "$GITHUB_OUTPUT"
          {
            echo "files<<CHANGED_EOF"
            echo "$CHANGED"
            echo "CHANGED_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compute build & image matrices
        id: compute
        run: |
          set -euo pipefail
          CHANGED_JSON=$(printf '%s' "${{ steps.diff.outputs.files }}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          RESULT=$(jq -c \
            --argjson changed "$CHANGED_JSON" \
            --argjson forceAll ${{ steps.diff.outputs.force_all }} \
            '
            def matches(paths):
              ([ $changed[] as $f | paths[] as $p | ($f | startswith($p)) ] | any);
            ( $forceAll or matches(.shared) ) as $all |
            {
              build_matrix: [ .modules[] | select($all or matches(.paths)) | .build ],
              images_matrix: ( [ .modules[] | select($all or matches(.paths)) | .image ]
                                + [ .extraImages[] | select($all or matches(.paths)) | .image ] )
            }
            ' .github/ci-matrix.json)
          echo "build_matrix=$(echo "$RESULT" | jq -c '.build_matrix')" >> "$GITHUB_OUTPUT"
          echo "images_matrix=$(echo "$RESULT" | jq -c '.images_matrix')" >> "$GITHUB_OUTPUT"
          echo "Changed files:"
          printf '%s\n' "${{ steps.diff.outputs.files }}"
          echo "force_all=${{ steps.diff.outputs.force_all }}"
          echo "build_matrix=$(echo "$RESULT" | jq -c '.build_matrix')"
          echo "images_matrix=$(echo "$RESULT" | jq -c '.images_matrix')"

  build:
    needs: changes
    if: needs.changes.outputs.build_matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.build_matrix) }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install tools
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global dotnet-coverage

      - name: Restore dependencies
        run: |
          dotnet restore ${{ matrix.projectName }}
          while IFS= read -r proj; do
            [ -z "$proj" ] && continue
            dotnet restore "$proj"
          done <<< "${{ matrix.projectTestNames }}"

      - name: Begin SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner begin \
            /k:"${{ matrix.sonarProjectKey }}" \
            /o:"adas-it" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.exclusions="docs/**,k8s/**,.github/**" \
            /d:sonar.cs.vscoveragexml.reportsPaths=${{ matrix.coverageFile }}

      - name: Build
        run: |
          dotnet build ${{ matrix.projectName }} --no-restore --configuration Release
          while IFS= read -r proj; do
            [ -z "$proj" ] && continue
            dotnet build "$proj" --no-restore --configuration Release
          done <<< "${{ matrix.projectTestNames }}"

      - name: Test with coverage
        run: |
          TEST_CMD=""
          while IFS= read -r proj; do
            [ -z "$proj" ] && continue
            if [ -n "$TEST_CMD" ]; then
              TEST_CMD="$TEST_CMD &&"
            fi
            TEST_CMD="$TEST_CMD dotnet test \"$proj\" --no-build --configuration Release --verbosity normal"
          done <<< "${{ matrix.projectTestNames }}"
          dotnet-coverage collect -f xml -o "${{ matrix.coverageFile }}" -- bash -c "$TEST_CMD"

      - name: End SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  build-push:
    name: Build & push service images to ACR
    needs: [ changes, build ]
    if: >
      always() &&
      github.event_name == 'push' &&
      needs.changes.outputs.images_matrix != '[]' &&
      needs.build.result != 'failure' &&
      needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: images-${{ github.sha }}
      cancel-in-progress: true
    env:
      ACR_LOGIN_SERVER: adait.azurecr.io
      AZURE_RESOURCE_GROUP: Personal
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.images_matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.image }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}

      - name: Build & push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            PROJECT=${{ matrix.project }}
            APP_DLL=${{ matrix.dll }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Point ${{ matrix.webApp }} at the new image
        run: |
          az webapp config container set \
            --name ${{ matrix.webApp }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --docker-custom-image-name ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.image }}:sha-${{ github.sha }} \
            --docker-registry-server-url https://${{ env.ACR_LOGIN_SERVER }} \
            --docker-registry-server-user ${{ secrets.ACR_USERNAME }} \
            --docker-registry-server-password ${{ secrets.ACR_PASSWORD }}

      - name: Restart ${{ matrix.webApp }}
        run: az webapp restart --name ${{ matrix.webApp }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }}
